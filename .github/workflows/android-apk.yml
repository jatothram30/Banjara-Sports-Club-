
name: Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract source
        run: unzip -o Banjara_Sports_Club_App_Prototype.zip -d app-source

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare Capacitor
        working-directory: app-source/banjara_sports_club_app
        run: |
          npm init -y
          npm install @capacitor/core@^7 @capacitor/cli@^7 @capacitor/android@^7
          mkdir -p www
          cp index.html manifest.json sw.js logo.png www/
          npx cap init "Banjara Sports Club" "com.banjarasportsclub.app" --web-dir www

      - name: Build APK
        working-directory: app-source/banjara_sports_club_app
        run: |
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Banjara-Sports-Club-APK
          path: app-source/banjara_sports_club_app/android/app/build/outputs/apk/debug/app-debug.apk
          
