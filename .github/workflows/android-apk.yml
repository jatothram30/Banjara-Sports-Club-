
name: Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Extract app source
        run: |
          unzip -o "Banjara_Sports_Club_App_Prototype(1).zip" -d app-source
          CONFIG=$(find app-source -type f -name capacitor.config.json -print -quit)
          if [ -z "$CONFIG" ]; then
            echo "capacitor.config.json not found"
            find app-source -maxdepth 5 -type f
            exit 1
          fi
          APP_DIR=$(dirname "$CONFIG")
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"
          ls -la "$APP_DIR"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: |
          cd "$APP_DIR"
          npm install
          npm install @capacitor/android@^7

      - name: Build Android APK
        run: |
          cd "$APP_DIR"
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Banjara-Sports-Club-APK
          path: ${{ env.APP_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          
