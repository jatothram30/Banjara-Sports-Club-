
name: Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract source
        run: unzip -o Banjara_Sports_Club_APK_Source.zip -d app-source

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Build APK
        working-directory: app-source
        run: |
          npm install
          npm install @capacitor/android@^7.0.0
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Banjara-Sports-Club-APK
          path: app-source/android/app/build/outputs/apk/debug/app-debug.apk
          
