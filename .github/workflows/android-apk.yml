
name: Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Extract app source
        run: |
          unzip -o "Banjara_Sports_Club_App_Prototype(1).zip" -d app-source
          MANIFEST=$(find app-source -type f -name manifest.json -print -quit)
          if [ -z "$MANIFEST" ]; then
            echo "manifest.json not found"
            find app-source -maxdepth 5 -type f
            exit 1
          fi
          DIR=$(dirname "$MANIFEST")
          if [ "$(basename "$DIR")" = "www" ]; then
            APP_DIR=$(dirname "$DIR")
          else
            APP_DIR="$DIR"
          fi
          mkdir -p "$APP_DIR/www"
          for FILE in index.html manifest.json sw.js logo.png; do
            SOURCE=$(find app-source -type f -name "$FILE" -print -quit)
            if [ -z "$SOURCE" ]; then
              echo "$FILE not found"
              exit 1
            fi
            TARGET="$APP_DIR/www/$FILE"
            if [ "$SOURCE" != "$TARGET" ]; then
              cp "$SOURCE" "$TARGET"
            fi
          done
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare Capacitor
        run: |
          cd "$APP_DIR"
          npm init -y
          npm install @capacitor/core@^7 @capacitor/cli@^7 @capacitor/android@^7
          npx cap init "Banjara Sports Club" "com.banjarasportsclub.app" --web-dir www

      - name: Build Android APK
        run: |
          cd "$APP_DIR"
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Banjara-Sports-Club-APK
          path: ${{ env.APP_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          
