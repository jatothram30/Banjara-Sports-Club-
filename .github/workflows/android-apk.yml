
name: Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Extract app source
        run: |
          unzip -o "Banjara_Sports_Club_App_Prototype(1).zip" -d app-source
          INDEX_FILE=$(find app-source -type f -name index.html -print -quit)
          if [ -z "$INDEX_FILE" ]; then
            echo "index.html not found in ZIP"
            exit 1
          fi
          APP_DIR=$(dirname "$INDEX_FILE")
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"
          echo "Found app at: $APP_DIR"
          ls -la "$APP_DIR"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare Capacitor
        run: |
          cd "$APP_DIR"
          test -f manifest.json
          test -f sw.js
          test -f logo.png
          npm init -y
          npm install @capacitor/core@^7 @capacitor/cli@^7 @capacitor/android@^7
          mkdir -p www
          cp index.html manifest.json sw.js logo.png www/
          npx cap init "Banjara Sports Club" "com.banjarasportsclub.app" --web-dir www

      - name: Build Android APK
        run: |
          cd "$APP_DIR"
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Banjara-Sports-Club-APK
          path: ${{ env.APP_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
